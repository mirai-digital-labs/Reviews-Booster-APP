let data;try{data=JSON.parse(localStorage.getItem('fcjh-demo-data'))||structuredClone(seed)}catch(e){data=JSON.parse(JSON.stringify(seed))}const params=new URLSearchParams(location.search), publicCampaign=params.get('campaign'), publicMode=params.get('view')==='customer'||!!publicCampaign;let activeCampaign=data.campaigns.find(c=>c.id===publicCampaign)||data.campaigns[0];let page=publicMode?'customer':'overview',filter='All',lang='en',customerRating=0,catRatings={Taste:0,Service:0,Speed:0,Cleanliness:0};

const pages={overview:()=>{let total=data.feedback.length,avg=total?(data.feedback.reduce((a,b)=>a+b.rating,0)/total).toFixed(1):'—',open=data.complaints.filter(x=>x.status!=='Resolved').length;return head('OWNER DASHBOARD','Good afternoon, Owner 👋','A live-style overview of customer experience across your branches.','<button class="btn" onclick="exportCSV()">↓ Export data</button><button class="btn primary" onclick="go(\'customer\')">Preview customer journey →</button>')+`<div class="grid stats">${stat('Feedback submissions',total,'Sample demo records','☷')}${stat('Average feedback rating',avg+'/5','Internal feedback · not Google rating','★')}${stat('Open complaints',open,'Needs team attention','⚑')}${stat('Active QR campaigns',data.campaigns.filter(x=>x.status==='Active').length,'Across configured placements','▧')}</div><div class="grid two"><div class="card"><div class="cardhead"><h3>Customer feedback trend</h3><span class="tag">Illustrative sample</span></div><div class="bars">${[35,48,42,65,54,76,90].map((v,i)=>`<div class="barcol"><div class="bar ${i===6?'hot':''}" style="height:${v}%"></div><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span></div>`).join('')}</div><div class="legend" style="margin-top:13px"><span><i class="dot"></i>Feedback volume (illustrative)</span></div></div><div class="card"><div class="cardhead"><h3>Branch snapshot</h3><span class="tag">${data.branches.length} branches</span></div><div class="branchlist">${data.branches.map(b=>`<div class="branchrow"><div class="branchmark">⌖</div><div class="branchinfo"><b>${esc(b.name)}</b><small>${b.id} · ${b.status}</small><div class="progress"><i style="width:${b.feedback?Math.min(100,b.feedback):0}%"></i></div></div><b>${b.feedback||'—'}</b></div>`).join('')}</div></div></div><div class="card" style="margin-top:16px"><div class="cardhead"><h3>Latest customer feedback</h3><button class="btn" onclick="go('feedback')">View inbox →</button></div>${table(['Reference','Branch','Rating','Comment','Status'],data.feedback.slice(0,4).map(f=>`<tr><td><b>${f.id}</b></td><td>${esc(branchName(f.branch))}</td><td>${stars(f.rating)}</td><td>${esc(f.comment.slice(0,58))}</td><td><span class="tag ${f.status==='Resolved'?'green':f.status==='New'?'orange':''}">${f.status}</span></td></tr>`).join(''))}</div>`},
customer:()=>head('CUSTOMER EXPERIENCE','Try the customer QR journey','Owner demo: switch language, submit feedback and see the thank-you flow.','<button class="btn" onclick="resetCustomer()">↻ Reset demo</button>')+`<div class="notice">This is the customer-facing web experience preview. In production, each branch/campaign QR will open its own unique link. Customer login is not required.</div><div class="customer"><div class="custtop"><div class="custlogo">FC</div><b>FRI-CHICKS JHANG</b><div class="small" style="color:#bbb">${publicMode?esc(branchName(activeCampaign?.branch||'JHG-01'))+' · '+esc(activeCampaign?.name||'Customer feedback'): 'We value your visit'}</div><div class="small" style="color:#bbb">We value your visit</div></div><div class="custbody" id="custbody">${customerForm()}</div></div>`,
branches:()=>head('BRANCH MANAGEMENT','Your branches','Manage branch details and branch-level performance.','<button class="btn primary" onclick="branchModal()">＋ Add branch</button>')+`<div class="notice">Demo currently includes a Jhang Main branch and a planned second branch. Replace sample details with owner-approved branch information before launch.</div><div class="grid two">${data.branches.map(b=>`<div class="card"><div class="split"><div><div class="eyebrow">${b.id}</div><h3 style="margin:5px 0">${esc(b.name)}</h3><div class="sub">${esc(b.city)}</div></div><span class="tag ${b.status==='Active'?'green':'orange'}">${b.status}</span></div><div class="grid three" style="margin-top:20px"><div><div class="statlabel">Feedback</div><b style="font-size:20px">${b.feedback||'—'}</b></div><div><div class="statlabel">Internal score</div><b style="font-size:20px">${b.rating?b.rating+'/5':'—'}</b></div><div><div class="statlabel">Campaigns</div><b style="font-size:20px">${data.campaigns.filter(c=>c.branch===b.id).length}</b></div></div><div style="margin-top:18px"><button class="btn" onclick="editBranch('${b.id}')">Edit branch</button></div></div>`).join('')}</div>`,
campaigns:()=>head('QR CAMPAIGNS','QR campaign manager','Generate real scannable QR codes for each branch and placement.','<button class="btn primary" onclick="campaignModal()">＋ New campaign</button>')+`<div class="notice">QR codes encode this site’s live URL plus a unique campaign ID. Deploy to Cloudflare Pages first, then open this page on the deployed domain and download the QR images for printing.</div><div class="grid two">${data.campaigns.map(c=>`<div class="card"><div class="split"><div><div class="eyebrow">${c.id}</div><h3 style="margin:5px 0">${esc(c.name)}</h3><div class="sub">${esc(branchName(c.branch))} · ${esc(c.placement)}</div></div><span class="tag ${c.status==='Active'?'green':'orange'}">${c.status}</span></div><div class="grid" style="grid-template-columns:140px 1fr;align-items:center;margin-top:20px"><div id="qr-${c.id}" class="qrbox" style="background:#fff;padding:8px">Generating…</div><div><div class="statlabel">Campaign QR link</div><div class="small" id="url-${c.id}" style="overflow-wrap:anywhere"></div><div style="margin-top:12px;display:flex;gap:7px;flex-wrap:wrap"><button class="btn" onclick="copyCampaignUrl('${c.id}')">Copy link</button><button class="btn primary" onclick="downloadQR('${c.id}')">Download QR PNG</button></div></div></div></div>`).join('')}</div>`,feedback:()=>{let fs=data.feedback.filter(f=>filter==='All'||f.status===filter);return head('FEEDBACK INBOX','Hear every customer','Internal feedback is private to the business and is not the same as a Google review.','<button class="btn" onclick="exportCSV()">↓ Export CSV</button>')+`<div class="tabs">${['All','New','In review','Resolved'].map(x=>`<button class="${filter===x?'active':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div><div class="card">${table(['Reference','Date','Branch','Rating','Customer comment','Status','Action'],fs.map(f=>`<tr><td><b>${f.id}</b></td><td>${f.date}</td><td>${esc(branchName(f.branch))}</td><td>${stars(f.rating)}</td><td style="max-width:310px;white-space:normal">${esc(f.comment)}</td><td><span class="tag ${f.status==='Resolved'?'green':f.status==='New'?'orange':''}">${f.status}</span></td><td><button class="btn" onclick="feedbackAction('${f.id}')">Manage</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No feedback in this filter.</td></tr>')}</div>`},
complaints:()=>head('SERVICE RECOVERY','Complaints & follow-up','Assign, track and resolve customer issues with a clear audit trail.','<button class="btn primary" onclick="complaintModal()">＋ Log complaint</button>')+`<div class="grid stats">${stat('Total complaints',data.complaints.length,'Sample records','⚑')}${stat('Open',data.complaints.filter(c=>c.status==='Open').length,'Awaiting action','!')}${stat('In progress',data.complaints.filter(c=>c.status==='In progress').length,'Being handled','↻')}${stat('Resolved',data.complaints.filter(c=>c.status==='Resolved').length,'Closed cases','✓')}</div><div class="card">${table(['Case','Issue','Branch','Priority','Date','Status','Action'],data.complaints.map(c=>`<tr><td><b>${c.id}</b></td><td>${esc(c.title)}</td><td>${esc(branchName(c.branch))}</td><td><span class="tag ${c.priority==='High'?'red':''}">${c.priority}</span></td><td>${c.date}</td><td><span class="tag ${c.status==='Resolved'?'green':'orange'}">${c.status}</span></td><td><button class="btn" onclick="complaintAction('${c.id}')">Update</button></td></tr>`).join(''))}</div>`,
reviews:()=>head('GOOGLE REPUTATION','Google reviews workspace','Authorized Google Business Profile connection is required for live review data and replies.','<button class="btn" onclick="toast(\'Demo only: connect an authorized Google account in production.\')">Connect Google account</button>')+`<div class="notice rednote"><b>Integration status: Not connected / not verified.</b> The entries below are clearly labelled sample records. No live Google reviews have been fetched and no replies have been sent.</div><div class="card"><div class="cardhead"><h3>Review workflow preview</h3><span class="tag">Sample records only</span></div>${table(['Record','Author','Branch','Rating','Date','Reply status'],data.reviews.map(r=>`<tr><td><b>${r.id}</b></td><td>${esc(r.author)}</td><td>${esc(branchName(r.branch))}</td><td>${stars(r.rating)}</td><td>${r.date}</td><td><span class="tag">${r.state}</span></td></tr>`).join(''))}</div><div class="card" style="margin-top:16px"><h3 style="margin:0 0 8px">Compliant customer invitation</h3><p class="sub">Every customer sees the same neutral invitation to leave an honest Google review, regardless of their private feedback rating. No filtering or incentives.</p><button class="btn soft" onclick="toast('Preview: neutral Google review invitation for all customers.')">Preview invitation copy</button></div>`,
reports:()=>head('ANALYTICS','Reports & insights','Download internal feedback and complaint data for owner review.','<button class="btn primary" onclick="exportCSV()">↓ Download feedback CSV</button>')+`<div class="grid stats">${stat('Total submissions',data.feedback.length,'Current local demo data','☷')}${stat('Positive (4–5)',data.feedback.filter(x=>x.rating>=4).length,'Internal ratings only','＋')}${stat('Needs attention (1–3)',data.feedback.filter(x=>x.rating<=3).length,'Internal ratings only','!')}${stat('Complaint cases',data.complaints.length,'Current local demo data','⚑')}</div><div class="grid two"><div class="card"><h3>Rating distribution</h3>${[5,4,3,2,1].map(n=>`<div class="branchrow" style="margin:13px 0"><b style="width:38px">${n} ★</b><div class="progress" style="flex:1"><i style="width:${data.feedback.length?100*data.feedback.filter(x=>x.rating===n).length/data.feedback.length:0}%"></i></div><span class="small muted">${data.feedback.filter(x=>x.rating===n).length}</span></div>`).join('')}</div><div class="card"><h3>Reporting notes</h3><p class="sub">Internal feedback score is calculated from feedback form submissions. It must never be presented as the Google Business Profile rating.</p><p class="sub">Live Google review counts and ratings will appear only after a supported, authorized integration is connected and data is verified.</p></div></div>`,
settings:()=>head('CONFIGURATION','Settings & launch readiness','Business setup, access roles, languages and production requirements.','<button class="btn primary" onclick="toast(\'Settings saved in this browser demo.\')">Save settings</button>')+`<div class="grid two"><div class="card"><h3>Business profile</h3><div class="formgrid" style="margin-top:16px"><div class="field full"><label>Business name</label><input value="Fri-Chicks Jhang" id="bizname"></div><div class="field"><label>Primary location</label><input value="Jhang, Punjab" id="bizloc"></div><div class="field"><label>Supported branches</label><input value="2–5" disabled></div><div class="field full"><label>Customer languages</label><input value="English · اردو · Roman Urdu" disabled></div></div></div><div class="card"><h3>Access roles</h3><div class="branchlist" style="margin-top:16px"><div class="branchrow"><div class="branchmark">👑</div><div class="branchinfo"><b>Owner / Admin</b><small>All branches, reports, users, integrations and settings</small></div></div><div class="branchrow"><div class="branchmark">⌖</div><div class="branchinfo"><b>Branch Manager</b><small>Assigned branch feedback, complaints and local operations</small></div></div><div class="branchrow"><div class="branchmark">◉</div><div class="branchinfo"><b>Staff (optional)</b><small>Limited complaint updates; no global settings</small></div></div></div></div></div><div class="card" style="margin-top:16px"><h3>Production launch checklist</h3><div class="grid two" style="margin-top:12px"><div>${['Confirm official branch names, addresses and phone numbers','Create production hosting and HTTPS domain','Configure production database and backups','Set up owner login, MFA and branch permissions'].map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">☐ ${x}</div>`).join('')}</div><div>${['Obtain authorized Google Business Profile access/API approval','Create real branch-specific QR links and printable QR artwork','Configure notification provider and consent/privacy notices','Complete security, load and user acceptance testing'].map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">☐ ${x}</div>`).join('')}</div></div></div>`};
function go(p){page=p;filter='All';render()}$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function customerForm(){let txt=lang==='ur'?{title:'آپ کا تجربہ کیسا رہا؟',sub:'آپ کی رائے ہمارے لیے اہم ہے۔',rate:'اپنی مجموعی ریٹنگ دیں',comment:'اپنا تبصرہ (اختیاری)',submit:'فیڈبیک جمع کروائیں'}:lang==='ru'?{title:'Aap ka experience kaisa raha?',sub:'Aap ki rai hamaray liye important hai.',rate:'Overall rating dein',comment:'Apna comment (optional)',submit:'Feedback submit karein'}:{title:'How was your experience?',sub:'Your feedback helps us serve you better.',rate:'Rate your overall experience',comment:'Tell us more (optional)',submit:'Submit feedback'};return `<div class="langswitch"><button class="${lang==='en'?'active':''}" onclick="setLang('en')">English</button><button class="${lang==='ur'?'active':''}" onclick="setLang('ur')">اردو</button><button class="${lang==='ru'?'active':''}" onclick="setLang('ru')">Roman Urdu</button></div><h2 class="${lang==='ur'?'rtl':''}">${txt.title}</h2><p>${txt.sub}</p><div class="small muted" style="text-align:center">${txt.rate}</div><div class="rating">${[1,2,3,4,5].map(n=>`<button class="${customerRating>=n?'selected':''}" onclick="rate(${n})">★</button>`).join('')}</div><div class="catratings">${Object.keys(catRatings).map(k=>`<div class="catrow"><span>${k}</span><span class="mini">${[1,2,3,4,5].map(n=>`<button class="${catRatings[k]>=n?'selected':''}" onclick="catRate('${k}',${n})">★</button>`).join('')}</span></div>`).join('')}</div><div class="field"><label>${txt.comment}</label><textarea id="custcomment" placeholder="Share your experience..."></textarea></div><button class="btn primary" style="margin-top:15px" onclick="submitCustomer()">${txt.submit} →</button><div class="small muted" style="text-align:center;margin-top:12px">No login required · Your feedback is handled separately from public Google reviews.</div>`}
function setLang(l){lang=l;$('#custbody').innerHTML=customerForm()}function rate(n){customerRating=n;$('#custbody').innerHTML=customerForm()}function catRate(k,n){catRatings[k]=n;$('#custbody').innerHTML=customerForm()}function resetCustomer(){customerRating=0;catRatings={Taste:0,Service:0,Speed:0,Cleanliness:0};$('#custbody').innerHTML=customerForm()}function submitCustomer(){if(!customerRating){toast('Please select an overall rating first.');return}let comment=$('#custcomment').value.trim();let branch=activeCampaign?.branch||'JHG-01';data.feedback.unshift({id:'FB-'+Date.now(),name:'Guest',branch,rating:customerRating,comment:comment||'No written comment',date:new Date().toLocaleString(),status:'New',campaign:activeCampaign?.id||'DEMO'});save();$('#custbody').innerHTML=`<div style="text-align:center;padding:30px 5px"><div style="font-size:42px">🎉</div><h2>Thank you for your feedback!</h2><p>Your feedback has been recorded for the Fri-Chicks team.</p><div class="notice" style="text-align:left;margin-top:20px">We invite every customer to share an honest review on Google. Your private feedback rating does not change this invitation.</div><button class="btn primary" onclick="googlePreview()">Continue to Google review ↗</button><div class="small muted" style="margin-top:12px">Demo preview only. A verified branch-specific Google review URL must be configured before launch.</div></div>`;save();toast('Demo feedback saved to this browser.')}function googlePreview(){toast('Google review link is not configured yet. Ask the owner to provide the official branch review URL.');}
function branchModal(id){let b=data.branches.find(x=>x.id===id)||{id:'',name:'',city:'Jhang',status:'Active'};showModal(`<button class="close" onclick="closeModal()">×</button><h2>${id?'Edit branch':'Add branch'}</h2><p class="sub">Branch information for the owner dashboard.</p><form class="formgrid" onsubmit="saveBranch(event,'${id||''}')"><div class="field"><label>Branch ID</label><input name="id" required value="${esc(b.id)}" ${id?'readonly':''}></div><div class="field"><label>Status</label><select name="status"><option ${b.status==='Active'?'selected':''}>Active</option><option ${b.status==='Planned'?'selected':''}>Planned</option></select></div><div class="field full"><label>Branch name</label><input name="name" required value="${esc(b.name)}"></div><div class="field full"><label>City / area</label><input name="city" required value="${esc(b.city)}"></div><div class="field full"><button class="btn primary">Save branch</button></div></form>`)}function editBranch(id){branchModal(id)}function saveBranch(e,old){e.preventDefault();let f=new FormData(e.target),b={id:f.get('id'),name:f.get('name'),city:f.get('city'),status:f.get('status'),feedback:0,rating:null};if(old){let i=data.branches.findIndex(x=>x.id===old);b.feedback=data.branches[i].feedback;b.rating=data.branches[i].rating;data.branches[i]=b}else data.branches.push(b);save();closeModal();render();toast('Branch saved in this browser demo.')}function campaignModal(){showModal(`<button class="close" onclick="closeModal()">×</button><h2>Create QR campaign</h2><p class="sub">Each placement gets a unique campaign reference.</p><form class="formgrid" onsubmit="saveCampaign(event)"><div class="field full"><label>Campaign name</label><input name="name" placeholder="e.g. Takeaway bag QR" required></div><div class="field"><label>Branch</label><select name="branch">${data.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>Placement</label><select name="placement"><option>Counter</option><option>Tables</option><option>Pizza boxes</option><option>Takeaway bags</option><option>Receipts</option></select></div><div class="field full"><button class="btn primary">Create campaign</button></div></form>`)}function saveCampaign(e){e.preventDefault();let f=new FormData(e.target),id='QR-'+Math.random().toString(36).slice(2,7).toUpperCase();data.campaigns.push({id,name:f.get('name'),branch:f.get('branch'),placement:f.get('placement'),scans:0,status:'Active'});save();closeModal();render();toast('Campaign created. QR artwork needs production URL.')}function campaignUrl(id){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('campaign',id);return u.toString()}function renderQRCodes(){if(!window.QRCode){setTimeout(renderQRCodes,500);return}data.campaigns.forEach(c=>{let el=document.getElementById('qr-'+c.id);if(!el)return;el.innerHTML='';new QRCode(el,{text:campaignUrl(c.id),width:124,height:124,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});let u=document.getElementById('url-'+c.id);if(u)u.textContent=campaignUrl(c.id)})}function copyCampaignUrl(id){let url=campaignUrl(id);navigator.clipboard?.writeText(url).then(()=>toast('QR link copied.')).catch(()=>prompt('Copy QR link:',url))}function downloadQR(id){let el=document.querySelector('#qr-'+CSS.escape(id)+' canvas');if(!el){toast('QR code is still loading.');return}let a=document.createElement('a');a.href=el.toDataURL('image/png');a.download='fri-chicks-'+id+'.png';a.click()}function copyCampaign(id){copyCampaignUrl(id)}
function setFilter(x){filter=x;render()}function feedbackAction(id){let f=data.feedback.find(x=>x.id===id);showModal(`<button class="close" onclick="closeModal()">×</button><h2>Manage ${id}</h2><p class="sub">${esc(f.comment)}</p><div class="field" style="margin:16px 0"><label>Internal status</label><select id="fbstatus"><option ${f.status==='New'?'selected':''}>New</option><option ${f.status==='In review'?'selected':''}>In review</option><option ${f.status==='Resolved'?'selected':''}>Resolved</option></select></div><button class="btn primary" onclick="saveFeedbackStatus('${id}')">Save status</button>`)}function saveFeedbackStatus(id){data.feedback.find(x=>x.id===id).status=$('#fbstatus').value;save();closeModal();render();toast('Feedback status updated.')}function complaintModal(){showModal(`<button class="close" onclick="closeModal()">×</button><h2>Log a complaint</h2><form class="formgrid" onsubmit="saveComplaint(event)"><div class="field full"><label>Issue title</label><input name="title" required></div><div class="field"><label>Branch</label><select name="branch">${data.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select name="priority"><option>Normal</option><option>High</option></select></div><div class="field full"><label>Details</label><textarea name="detail"></textarea></div><div class="field full"><button class="btn primary">Create case</button></div></form>`)}function saveComplaint(e){e.preventDefault();let f=new FormData(e.target);data.complaints.unshift({id:'CP-'+(210+data.complaints.length),title:f.get('title'),branch:f.get('branch'),priority:f.get('priority'),status:'Open',date:'Just now',detail:f.get('detail')});save();closeModal();render();toast('Complaint logged in demo.')}function complaintAction(id){let c=data.complaints.find(x=>x.id===id);showModal(`<button class="close" onclick="closeModal()">×</button><h2>${id} · ${esc(c.title)}</h2><p class="sub">${esc(c.detail)}</p><div class="field" style="margin:16px 0"><label>Case status</label><select id="cpstatus"><option ${c.status==='Open'?'selected':''}>Open</option><option ${c.status==='In progress'?'selected':''}>In progress</option><option ${c.status==='Resolved'?'selected':''}>Resolved</option></select></div><button class="btn primary" onclick="saveComplaintStatus('${id}')">Update case</button>`)}function saveComplaintStatus(id){data.complaints.find(x=>x.id===id).status=$('#cpstatus').value;save();closeModal();render();toast('Complaint updated.')}function exportCSV(){let rows=[['Reference','Date','Branch','Rating','Comment','Status'],...data.feedback.map(f=>[f.id,f.date,branchName(f.branch),f.rating,f.comment,f.status])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='fri-chicks-jhang-feedback-demo.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV export downloaded.')}render();
</script></body></html>
